# TokenSea CPA Configuration
# Configured for cli-proxy-api (cpa) v6.9+

host: "0.0.0.0"
port: 8080

auth-dir: "/CLIProxyAPI/auths"

api-keys:
  - "tsk-prod-key-001-change-me"
  - "tsk-prod-key-002-change-me"
  - "ts-internal-1"
  - "ts-codex-internal-1"

claude-api-key:
  - api-key: "ts-internal-1"
    base-url: "http://dario-1:3456"
    cloak:
      mode: "never"

codex-api-key:
  - api-key: "ts-codex-internal-1"
    base-url: "http://codex-dario-1:3457"
    models:
      - name: "gpt-5.5"
        alias: "gpt-5.5"
      - name: "o3"
        alias: "o3"
      - name: "o4-mini"
        alias: "o4-mini"
      - name: "gpt-4.1"
        alias: "gpt-4.1"
      - name: "gpt-4.1-mini"
        alias: "gpt-4.1-mini"
      - name: "gpt-4.1-nano"
        alias: "gpt-4.1-nano"
    cloak:
      mode: "never"

routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "4h"

request-retry: 3
max-retry-credentials: 3

debug: false

remote-management:
  allow-remote: true
  secret-key: "ts-mgmt-key-change-me"
  disable-control-panel: false
