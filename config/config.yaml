# TokenSea CPA Configuration
# Configured for cli-proxy-api (cpa) v6.9+
# Each dario node is an upstream with cloak.mode: "never" (dario handles fingerprinting)

# Server
host: "0.0.0.0"
port: 8080

# Auth directory
auth-dir: "/CLIProxyAPI/auths"

# API keys — clients authenticate to cpa with these keys
api-keys:
  - "tsk-prod-key-001-change-me"
  - "tsk-prod-key-002-change-me"

# Claude API keys — each dario node is an upstream entry
# cloak.mode: "never" disables cpa's built-in fingerprint injection since dario handles that
claude-api-key:
  - api-key: "ts-internal-1"
    base-url: "http://dario-1:3456"
    cloak:
      mode: "never"
  - api-key: "ts-internal-2"
    base-url: "http://dario-2:3456"
    cloak:
      mode: "never"
  - api-key: "ts-internal-3"
    base-url: "http://dario-3:3456"
    cloak:
      mode: "never"

# Routing — round-robin spreads load across Team seats evenly
routing:
  strategy: "round-robin"
  session-affinity: false
  session-affinity-ttl: "4h"

# Retry on 429/5xx — try next dario node
request-retry: 3
max-retry-credentials: 3

# Debug
debug: false
