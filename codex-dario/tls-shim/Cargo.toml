[package]
name = "tls-shim"
version = "0.1.0"
edition = "2021"
description = "TLS shim that matches Codex CLI's wire fingerprint (tokio-rustls + ring)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
hyper = { version = "1.8", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls-pki-types = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
