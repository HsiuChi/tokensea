# TokenSea — Claude Team/Max Subscription Pool Gateway
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d dario-1      # Start a single dario node
#   docker compose logs -f dario-1    # View logs
#   docker compose down               # Stop all services
#
# Before starting, copy .env.example to .env and fill in your credentials.
# Each dario-N node maps to one Team seat or Max subscription.

services:
  # ============================================
  # CPA — CLI Proxy API (Gateway)
  # ============================================
  cpa:
    image: eceasy/cli-proxy-api:v7.2.149
    container_name: tokensea-cpa
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "1455:1455"   # Codex OAuth callback
    volumes:
      - ./config/config.yaml:/CLIProxyAPI/config.yaml:ro
      - cpa-auths:/CLIProxyAPI/auths
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tokensea

  # ============================================
  # Redis — Session Cache for CPA
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tokensea-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tokensea

  # ============================================
  # Dario Nodes — One per Team Seat (or Max Subscription)
  # ============================================
  # Uncomment dario-2 and dario-3 when OAuth credentials are configured in .env
  # Each dario-N service maps to one Team seat (user) or one Max subscription.
  # For Team accounts:
  #   - Each seat is a separate user with their own OAuth token
  #   - Seats share org-level rate limits, so load distribution is key
  #   - Use round-robin routing (see config.yaml) to spread load evenly
  # OAuth credentials are injected via environment variables.
  # The DARIO_API_KEY must match the corresponding key in config.yaml.

  dario-1:
    profiles: ["dario"]
    build:
      context: ./dario-modified
      dockerfile: tokensea-Dockerfile
    container_name: tokensea-dario-1
    restart: unless-stopped
    environment:
      - DARIO_API_KEY=${DARIO_INTERNAL_KEY_1}
      - DARIO_OAUTH_ACCESS_TOKEN=${DARIO_1_OAUTH_ACCESS_TOKEN}
      - DARIO_OAUTH_REFRESH_TOKEN=${DARIO_1_OAUTH_REFRESH_TOKEN}
      - DARIO_OAUTH_EXPIRES_AT=${DARIO_1_OAUTH_EXPIRES_AT:-0}
      - DARIO_OAUTH_SCOPES=${DARIO_1_OAUTH_SCOPES:-user:inference}
      - DARIO_DEVICE_ID=${DARIO_1_DEVICE_ID:-}
      - DARIO_ACCOUNT_UUID=${DARIO_1_ACCOUNT_UUID:-}
      - DARIO_ACCOUNT_ID=${DARIO_1_ACCOUNT_ID:-seat-1}
      - DARIO_HOST=0.0.0.0
      - DARIO_PORT=3456
      # Codex/GPT subscription — dario v6 serves both Claude + Codex in one container
      - CODEX_DARIO_OAUTH_ACCESS_TOKEN=${CODEX_DARIO_1_OAUTH_ACCESS_TOKEN:-}
      - CODEX_DARIO_OAUTH_REFRESH_TOKEN=${CODEX_DARIO_1_OAUTH_REFRESH_TOKEN:-}
      - CODEX_DARIO_OAUTH_EXPIRES_AT=${CODEX_DARIO_1_OAUTH_EXPIRES_AT:-0}
      - CODEX_DARIO_ACCOUNT_ID=${CODEX_DARIO_1_ACCOUNT_ID:-codex-seat-1}
    ports:
      - "3456:3456"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3456/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - tokensea

  # dario-2 — Uncomment when seat-2 OAuth credentials are available
  # dario-2:
  #   build:
  #     context: ./dario-modified
  #     dockerfile: tokensea-Dockerfile
  #   container_name: tokensea-dario-2
  #   restart: unless-stopped
