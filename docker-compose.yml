  #     - DARIO_OAUTH_ACCESS_TOKEN=${DARIO_2_OAUTH_ACCESS_TOKEN}
  #     - DARIO_OAUTH_REFRESH_TOKEN=${DARIO_2_OAUTH_REFRESH_TOKEN}
  #     - DARIO_OAUTH_EXPIRES_AT=${DARIO_2_OAUTH_EXPIRES_AT:-0}
  #     - DARIO_OAUTH_SCOPES=${DARIO_2_OAUTH_SCOPES:-user:inference}
  #     - DARIO_DEVICE_ID=${DARIO_2_DEVICE_ID:-}
  #     - DARIO_ACCOUNT_UUID=${DARIO_2_ACCOUNT_UUID:-}
  #     - DARIO_ACCOUNT_ID=${DARIO_2_ACCOUNT_ID:-seat-2}
  #     - DARIO_ACCOUNT_TYPE=${DARIO_ACCOUNT_TYPE:-team}
  #     - DARIO_HOST=0.0.0.0
  #     - DARIO_PORT=3456
  #   expose:
  #     - "3456"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3456/healthz"]
  #     interval: 30s
  #     timeout: 5s
  #     start_period: 15s
  #     retries: 3
  #   networks:
  #     - tokensea

  # dario-3 — Uncomment when seat-3 OAuth credentials are available
  # dario-3:
  #   build:
  #     context: ./dario-modified
  #     dockerfile: tokensea-Dockerfile
  #   container_name: tokensea-dario-3
  #   restart: unless-stopped
  #   environment:
  #     - DARIO_API_KEY=${DARIO_INTERNAL_KEY_3}
  #     - DARIO_OAUTH_ACCESS_TOKEN=${DARIO_3_OAUTH_ACCESS_TOKEN}
  #     - DARIO_OAUTH_REFRESH_TOKEN=${DARIO_3_OAUTH_REFRESH_TOKEN}
  #     - DARIO_OAUTH_EXPIRES_AT=${DARIO_3_OAUTH_EXPIRES_AT:-0}
  #     - DARIO_OAUTH_SCOPES=${DARIO_3_OAUTH_SCOPES:-user:inference}
  #     - DARIO_DEVICE_ID=${DARIO_3_DEVICE_ID:-}
  #     - DARIO_ACCOUNT_UUID=${DARIO_3_ACCOUNT_UUID:-}
  #     - DARIO_ACCOUNT_ID=${DARIO_3_ACCOUNT_ID:-seat-3}
  #     - DARIO_ACCOUNT_TYPE=${DARIO_ACCOUNT_TYPE:-team}
  #     - DARIO_HOST=0.0.0.0
  #     - DARIO_PORT=3456
  #   expose:
  #     - "3456"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3456/healthz"]
  #     interval: 30s
  #     timeout: 5s
  #     start_period: 15s
  #     retries: 3
  #   networks:
  #     - tokensea

  # ============================================
  # Prometheus — Metrics Collection
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: tokensea-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - tokensea

  # ============================================
  # Grafana — Monitoring Dashboard
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: tokensea-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tokensea

# ============================================
# Volumes
# ============================================
volumes:
  cpa-auths:
  redis-data:
  prometheus-data:
  grafana-data:

# ============================================
# Network
# ============================================
networks:
  tokensea:
    driver: bridge
